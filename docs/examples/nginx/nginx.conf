worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream repository {
        server alfresco:8080;
    }

    upstream share {
        server share:8080;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 0;
        proxy_buffering off;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Surf configuration stores are for internal Share-to-Repository traffic.
        location ~ ^/alfresco/(?:service|s|wcservice|wcs)/remoteadm(?:/|$) {
            default_type text/plain;
            return 403 "Forbidden\n";
        }

        # Do not allow the Share proxy to bypass the Repository rule above.
        location ~ ^/share/(?:service/)?proxy/alfresco(?:-(?:noauth|feed|api))?/remoteadm(?:/|$) {
            default_type text/plain;
            return 403 "Forbidden\n";
        }

        # Preserve the existing protection for internal Search tracking APIs.
        location ~ ^/alfresco/(?:service|s|wcservice|wcs)/api/solr(?:/|$) {
            default_type text/plain;
            return 403 "Forbidden\n";
        }

        location ~ ^/share/(?:service/)?proxy/alfresco(?:-(?:noauth|feed|api))?/api/solr(?:/|$) {
            default_type text/plain;
            return 403 "Forbidden\n";
        }

        location ~ ^/share/(?:service/)?proxy/alfresco/-default-/proxy/[^/]+/api(?:/|$) {
            default_type text/plain;
            return 403 "Forbidden\n";
        }

        # Metrics are for trusted monitoring systems, not public clients.
        location ~ ^/alfresco/(?:service|s|wcservice|wcs)/prometheus(?:/|$) {
            default_type text/plain;
            return 403 "Forbidden\n";
        }

        location = /share {
            return 301 /share/;
        }

        location /share/ {
            proxy_pass http://share;
        }

        # Repository UI, REST/CMIS APIs, AOS, Web Scripts, and mobile clients.
        # Deny rules above take precedence over this intentionally broad route.
        location = /alfresco {
            proxy_pass http://repository;
        }

        location /alfresco/ {
            proxy_pass http://repository;
        }

        location / {
            proxy_pass http://repository;
        }
    }
}