# This Docker Compose file will spin up an ACS cluster on a local host.
# It requires a minimum of 13GB Memory to distribute among containers.
#
# For performance tuning, assign the container memory and give a percentage of
# it to the JVM. Use either the -Xms,-Xmx flags or the newly added flags in
# java 10+: -XX:MaxRAMPercentage and -XX:MinRAMPercentage.
# More details here:
# https://www.oracle.com/technetwork/java/javase/10-relnote-issues-4108729.html
#
# Note: The Docker Compose file from github.com is a limited trial that goes
# into read-only mode after 2 days. Get the latest compose.yaml file with
# a 30-day trial license by accessing the Alfresco Content Services trial
# download page at:
# https://www.alfresco.com/platform/content-services-ecm/trial/download
#
services:
  alfresco:
#    image: quay.io/alfresco/alfresco-content-repository:26.2.2
#    image: alfresco/alfresco-governance-repository-enterprise-base:latest
    image: quay.io/alfresco/alfresco-governance-repository-enterprise:26.3.0-A.15
    mem_limit: 1900m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.createIndexIfNotExists=true
        -Delasticsearch.host=elasticsearch
        -Delasticsearch.port=9200
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Ddeployment.method=DOCKER_COMPOSE
        -Dtransform.service.enabled=true
        -Dtransform.service.url=http://transform-router:8095
        -Dsfs.url=http://shared-file-store:8099/
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Ddsync.service.uris=http://localhost:9090/alfresco
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Drepo.event2.filter.nodeTypes=sys:*,fm:*,cm:thumbnail,cm:failedThumbnail,cm:rating,usr:user
        -Ddeployment.method=DOCKER_COMPOSE
        -Didentity-service.auth-server-url=http://192.168.0.103:8999/auth
        -Dauthentication.chain=identity-service1:identity-service,alfrescoNtlm1:alfrescoNtlm
        -Didentity-service.authentication.enabled=true
        -Didentity-service.enable-basic-auth=true
        -Didentity-service.realm=alfresco
        -Didentity-service.resource=alfresco

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 1m
    volumes:
      - /usr/local/tomcat/alf_data
    extends:
      file: commons/base.yaml
      service: alfresco
  transform-router:
    mem_limit: 512m
    image: quay.io/alfresco/alfresco-transform-router:4.4.4-A.7
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
      ACTIVEMQ_URL: nio://activemq:61616
      CORE_AIO_URL: http://transform-core-aio:8090
      FILE_STORE_URL: >-
        http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/actuator/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s
    depends_on:
      activemq:
        condition: service_healthy
      shared-file-store:
        condition: service_healthy
  transform-core-aio:
    image: quay.io/alfresco/alfresco-transform-core-aio:5.4.4-A.6
    mem_limit: 1536m
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dtransform.endpoint.test.enable=true
        -Dtransform.core.libreoffice.templateProfileDir=
      ACTIVEMQ_URL: nio://activemq:61616
      FILE_STORE_URL: >-
        http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      activemq:
        condition: service_healthy
      shared-file-store:
        condition: service_healthy
  shared-file-store:
    image: quay.io/alfresco/alfresco-shared-file-store:4.4.4-A.7
    mem_limit: 512m
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
      scheduler.content.age.millis: 86400000
      scheduler.cleanup.interval: 86400000
    ports:
      - "8099:8099"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/ready"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 10s
    volumes:
      - /tmp/Alfresco
  share:
#    image: quay.io/alfresco/alfresco-share:26.2.2
#    image: alfresco/alfresco-governance-share-enterprise-base:latest
    image: quay.io/alfresco/alfresco-governance-share-enterprise:26.3.0-A.15
    mem_limit: 1g
    environment:
      CSRF_FILTER_ORIGIN: http://localhost:8080
      CSRF_FILTER_REFERER: http://localhost:8080/share/.*
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 15s
    depends_on:
      alfresco:
        condition: service_healthy
    extends:
      file: commons/base.yaml
      service: share
  postgres:
    image: postgres:17.5
    mem_limit: 512m
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  elasticsearch:
    image: elasticsearch:8.17.3
    mem_limit: 1536m
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms768m -Xmx768m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    ports:
      - 9200:9200
      - 9300:9300
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X GET http://localhost:9200/_cluster/health?pretty | grep status | grep -q '\\(green\\|yellow\\)'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
  kibana:
    image: kibana:7.17.26
    mem_limit: 1g
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-o", "/dev/null", "http://localhost:5601/status"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 30s
  search:
    image: quay.io/alfresco/alfresco-elasticsearch-live-indexing:5.9.0-A.1
    mem_limit: 1g
    environment:
      ALFRESCO_ACCEPTED_CONTENT_MEDIA_TYPES_CACHE_BASE_URL: >-
        http://transform-core-aio:8090/transform/config
      ALFRESCO_SHAREDFILESTORE_BASEURL: >-
        http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file/
      SPRING_ACTIVEMQ_BROKERURL: nio://activemq:61616
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 20s
    depends_on:
      elasticsearch:
        condition: service_healthy
      transform-core-aio:
        condition: service_healthy
      shared-file-store:
        condition: service_healthy
  search-reindexing:
    image: quay.io/alfresco/alfresco-elasticsearch-reindexing:5.9.0-A.1
    mem_limit: 1g
    restart: on-failure:5
    environment:
      ALFRESCO_ACCEPTED_CONTENT_MEDIA_TYPES_CACHE_BASE_URL: >-
        http://transform-core-aio:8090/transform/config
      SPRING_ACTIVEMQ_BROKERURL: nio://activemq:61616
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfresco
      SPRING_DATASOURCE_USERNAME: alfresco
      SPRING_DATASOURCE_PASSWORD: alfresco
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      ALFRESCO_METRICS_LOGGER_ENABLED: "true"
      ALFRESCO_REINDEX_ACS_URL: http://alfresco:8080

      ALFRESCO_REINDEX_PREFIXMAPPING_FETCHFROMACS: "false"
      ALFRESCO_REINDEX_PREFIXMAPPING_CACHE_FILE: /tmp/namespace-prefixes-cache/prefixes_keycloak_custom.json
      ALFRESCO_REINDEX_AUTH_TYPE: oauth2
      ALFRESCO_REINDEX_AUTH_CLIENT_ID: alfresco-reindexing
      ALFRESCO_REINDEX_AUTH_CLIENT_SECRET: reindexing-secret
      ALFRESCO_REINDEX_AUTH_GRANT_TYPE: client_credentials
      ALFRESCO_REINDEX_AUTH_TOKEN_URI: http://192.168.0.103:8999/auth/realms/alfresco/protocol/openid-connect/token

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      alfresco:
        condition: service_healthy
      keycloak:
        condition: service_started
  activemq:
    image: quay.io/alfresco/alfresco-activemq:5.18-jre17-rockylinux8
    mem_limit: 1g
    ports:
      - "8161:8161" # Web Console
      - "5672:5672" # AMQP
      - "30616:61616" # OpenWire (host port remapped - 61616 is in Windows' reserved/excluded TCP port range)
      - "30613:61613" # STOMP (host port remapped - 61613 is in Windows' reserved/excluded TCP port range)
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health", "|", "grep", "Good"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    command: [ "start-dev", "--import-realm", "--http-relative-path=/auth", "--hostname=192.168.0.103", "--http-enabled=true" ]
    volumes:
      - ./realms/alfresco-realm.json:/opt/keycloak/data/import/alfresco-realm.json
    ports:
      - "8999:8080"

