  digital-workspace:
    image: quay.io/alfresco/alfresco-digital-workspace:8.0.0
    mem_limit: 128m
    environment:
      APP_CONFIG_PROVIDER: "ECM"
      APP_CONFIG_AUTH_TYPE: "BASIC"
      BASE_PATH: ./
      APP_CONFIG_PLUGIN_PROCESS_SERVICE: "false"
      APP_CONFIG_PLUGIN_MICROSOFT_ONLINE: "false"
      APP_BASE_SHARE_URL: "http://localhost:8080/workspace/#/preview/s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: digital-workspace
  control-center:
    image: quay.io/alfresco/alfresco-control-center:11.1.0-32721605484
    mem_limit: 128m
    environment:
      APP_CONFIG_PROVIDER: "ECM"
      APP_CONFIG_AUTH_TYPE: "BASIC"
      BASE_PATH: ./
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: control-center
  proxy:
    extends:
      file: commons/base.yaml
      service: proxy
  sync-service:
    image: quay.io/alfresco/service-sync:5.3.6-A.3
    mem_limit: 1g
    environment:
      JAVA_OPTS: >-
        -Dsync.cluster.enabled=false
        -Dsql.db.driver=org.postgresql.Driver
        -Dsql.db.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsql.db.username=alfresco
        -Dsql.db.password=alfresco
        -Dmessaging.broker.host=activemq
        -Drepo.hostname=alfresco
        -Drepo.port=8080
        -Ddw.server.applicationConnectors[0].type=http
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    ports:
      - "9092:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/alfresco/healthcheck"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      alfresco:
        condition: service_healthy
    extends:
      file: commons/base.yaml
      service: sync-service
