# This Docker Compose file will spin up an ACS cluster on a local host.
# It requires a minimum of 13GB Memory to distribute among containers.
#
# For performance tuning, assign the container memory and give a percentage of
# it to the JVM. Use either the -Xms,-Xmx flags or the newly added flags in
# java 10+: -XX:MaxRAMPercentage and -XX:MinRAMPercentage.
# More details here:
# https://www.oracle.com/technetwork/java/javase/10-relnote-issues-4108729.html
#
# Note: The Docker Compose file from github.com is a limited trial that goes
# into read-only mode after 2 days. Get the latest compose.yaml file with
# a 30-day trial license by accessing the Alfresco Content Services trial
# download page at:
# https://www.alfresco.com/platform/content-services-ecm/trial/download
#
services:
  alfresco:
    image: quay.io/alfresco/alfresco-content-repository:25.1.0
    mem_limit: 1900m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dindex.subsystem.name=elasticsearch
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Ddeployment.method=DOCKER_COMPOSE
        -Dsfs.url=http://shared-file-store:8099/
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Ddsync.service.uris=http://localhost:9090/alfresco
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Didentity-service.auth-server-url=http://172.26.84.44:8999/auth
        -Dauthentication.chain=identity-service1:identity-service,alfrescoNtlm1:alfrescoNtlm
        -Didentity-service.realm=alfresco
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-" ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 1m
    volumes:
      - /usr/local/tomcat/alf_data
    extends:
      file: commons/base.yaml
      service: alfresco

  postgres:
    image: postgres:14.4
    mem_limit: 512m
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  digital-workspace:
    image: quay.io/alfresco/alfresco-digital-workspace:6.0.0
    mem_limit: 128m
    environment:
      APP_CONFIG_PROVIDER: "BPM"
      APP_CONFIG_AUTH_TYPE: "OAUTH2"
      APP_CONFIG_PLUGIN_CONTENT_SERVICE: "true"
      APP_CONFIG_OIDC_CLIENTID: "60a9b6c5-64ef-405f-8c6f-66bd8cd3878a"
      APP_CONFIG_OIDC_AUTHORITY: "http://172.26.84.44:8999/auth/realms/alfresco"
      APP_CONFIG_OIDC_REDIRECT_SILENT_IFRAME_URI: "http://digital-workspace:8080/workspace/assets/silent-refresh.html"
      APP_CONFIG_OIDC_SCOPES: "admin"
      BASE_PATH: ./
      APP_CONFIG_PLUGIN_PROCESS_SERVICE: "false"
      APP_CONFIG_PLUGIN_MICROSOFT_ONLINE: "false"
      APP_BASE_SHARE_URL: "http://localhost:8080/workspace/#/preview/s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: digital-workspace
  control-center:
    image: quay.io/alfresco/alfresco-control-center:9.3.0
    mem_limit: 128m
    environment:
      APP_CONFIG_PROVIDER: "ECM"
      APP_CONFIG_AUTH_TYPE: "BASIC"
      BASE_PATH: ./
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: control-center
  proxy:
    extends:
      file: commons/base.yaml
      service: proxy

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    command: [ "start-dev", "--import-realm", "--http-relative-path=/auth", "--hostname=172.26.84.44", "--http-enabled=true" ]
    volumes:
      - ./realms/alfresco-realm.json:/opt/keycloak/data/import/alfresco-realm.json
    ports:
      - "8999:8080"

  process-service:
    image: quay.io/alfresco/alfresco-process-services:24.3.0
    environment:
      - IDENTITY_SERVICE_AUTH=http://172.26.84.44:8999/auth
      - IDENTITY_SERVICE_REALM=alfresco
      - IDENTITY_SERVICE_USE_BASIC_AUTH=false
      - IDENTITY_SERVICE_CLIENT_ID=60a9b6c5-64ef-405f-8c6f-66bd8cd3878a
      - ACTIVITI_ADMIN_REST_APP_USERNAME=admin
      - ACTIVITI_ADMIN_REST_APP_PASSWORD=admin
    ports:
      - "9001:8080"
    volumes:
      - type: bind
        source: ./license/activiti.lic
        target: /home/alfresco/.activiti/enterprise-license/activiti.lic

  process-service-admin:
    image: quay.io/alfresco/alfresco-process-services-admin:24.3.0
    environment:
      - IDENTITY_SERVICE_AUTH=http://172.26.84.44:8999/auth
      - IDENTITY_SERVICE_REALM=alfresco
      - IDENTITY_SERVICE_CLIENT_SECRET=secret
      - IDENTITY_SERVICE_USE_BASIC_AUTH=false
      - ACTIVITI_ADMIN_REST_APP_USERNAME=admin@app.activiti.com
      - ACTIVITI_ADMIN_REST_APP_PASSWORD=admin
    ports:
      - "9002:8080"
