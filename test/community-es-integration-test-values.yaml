---
# Overlay on top of community-integration-test-values.yaml that switches the community stack from
# Solr to the Elasticsearch batch indexing component (alfresco-search-community),
# with resource sizing tuned for the KIND integration runner.
alfresco-search:
  enabled: false
alfresco-search-community:
  enabled: true
  resources:
    requests:
      cpu: "0.01"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "1Gi"
  environment:
    JAVA_OPTS: "-Xms256m -Xmx768m"
elasticsearch:
  enabled: true
  elasticsearch:
    resources:
      requests:
        cpu: "0.01"
        memory: "512Mi"
      limits:
        memory: "1.5Gi"
    livenessProbe:
      initialDelaySeconds: 100
    readinessProbe:
      initialDelaySeconds: 100
alfresco-repository:
  configuration:
    search:
      flavor: elasticsearch
