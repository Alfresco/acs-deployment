---
# Overlay on top of community-integration-test-values.yaml with resource sizing tuned for the
# KIND integration runner, for the Elasticsearch batch indexing component (alfresco-search-community)
# already enabled by default in community_values.yaml.
alfresco-search-community:
  resources:
    requests:
      cpu: "0.01"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "1Gi"
  environment:
    JAVA_OPTS: "-Xms256m -Xmx768m"
elasticsearch:
  elasticsearch:
    resources:
      requests:
        cpu: "0.01"
        memory: "512Mi"
      limits:
        memory: "1.5Gi"
    livenessProbe:
      initialDelaySeconds: 100
    readinessProbe:
      initialDelaySeconds: 100
