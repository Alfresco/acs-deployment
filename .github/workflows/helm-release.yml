---
name: Helm release

on:
  push:
    tags:
      - v**

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure no dependencies are pre-release versions
        run: |
          ! grep -e "-alpha" -e "-SNAPSHOT" helm/alfresco-content-services/Chart.yaml

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: charts
          permission-contents: write

      - name: Publish chart
        uses: >-
          Alfresco/alfresco-build-tools/.github/actions/dbp-charts/publish-chart@v19.6.1
        with:
          chart_name: alfresco-content-services
          github_token: ${{ steps.app-token.outputs.token }}
          github_username: ${{ steps.app-token.outputs.app-slug }}[bot]
          github_email: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
